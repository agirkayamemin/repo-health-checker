[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-health-checker"
dynamic = ["version"]
description = "Read-only health analysis for local Git repositories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repo-health-checker = "repo_health_checker.cli:main"

[tool.setuptools.dynamic]
version = {attr = "repo_health_checker.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"